# Entorno de desarrollo local: PostgreSQL (reemplaza RDS) y un S3 compatible (reemplaza Amazon S3).
#
# Nota: MinIO archivó su edición comunitaria (sin binarios ni parches de seguridad),
# por eso se usa RustFS, compatible con la API de S3/MinIO (Apache-2.0).
# Si prefieres la imagen archivada de MinIO, ver el bloque comentado al final.
#
#   docker compose up -d
#   npm run s3:init        # crea el bucket y aplica CORS
#   npm run migrate:dev && npm run seed
services:
  postgres:
    image: postgres:16-alpine
    container_name: gestor-postgres
    environment:
      POSTGRES_USER: gestor
      POSTGRES_PASSWORD: gestor
      POSTGRES_DB: gestor_documental
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gestor -d gestor_documental"]
      interval: 5s
      retries: 10

  s3:
    image: rustfs/rustfs:1.0.0
    container_name: gestor-s3
    environment:
      RUSTFS_ACCESS_KEY: minioadmin
      RUSTFS_SECRET_KEY: minioadmin
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - s3data:/data

  # Alternativa con MinIO (imagen archivada, sin actualizaciones de seguridad):
  # minio:
  #   image: minio/minio:latest
  #   command: server /data --console-address ":9001"
  #   environment:
  #     MINIO_ROOT_USER: minioadmin
  #     MINIO_ROOT_PASSWORD: minioadmin
  #   ports: ["9000:9000", "9001:9001"]
  #   volumes: [s3data:/data]

volumes:
  pgdata:
  s3data:
